# ============================================================================
# SGLang — Qwen3.8-27B-INT8-W8A16-MTP (serveur d'inférence, Docker)
#
# Équivalent Docker de start.sh : mêmes arguments launch_server, mêmes
# réglages réseau/NCCL (2× RTX 3090 sans NVLink), port 1234.
#
# POUR UNE AUTRE MACHINE :
#   1. cp .env.example .env
#   2. Éditer .env : SGLANG_MODEL_ROOT (chemin du cache Hugging Face local du modèle)
#   3. docker compose up -d
#
# Image officielle SGLang (Docker Hub) : lmsysorg/sglang
#   - "latest"          = dernier stable, CUDA 13, outils de build inclus
#     (nécessaire : compilation JIT des kernels GPTQ-Marlin au 1er boot).
#     ⚠️ PAS de DFLASH2 : aucune release ne contient encore le sélecteur
#     DFLASH2 (landed après 0.5.17, PR #35371 + #35496).
#   - "dev"             = build roulant depuis main → contient DFLASH2.
#     À utiliser pour le décodage spéculatif DFLASH2 (voir SPEC_ALGORITHM).
#   - "latest-runtime"  = plus léger (~40 %) mais SANS outils de build
#   - "latest-cu129"    = variante CUDA 12.9 (driver hôte < 580)
#
# Variables (défauts entre parenthèses) — voir .env.example :
#   SGLANG_PORT (1234), SGLANG_HOST (0.0.0.0), SGLANG_TP (2),
#   SGLANG_GPU_COUNT (2), SGLANG_CONTEXT_LENGTH (220000), SGLANG_MEM_FRACTION
#   (0.95), SGLANG_MAX_CONCURRENT_REQUESTS (2), SGLANG_ATTN_BACKEND
#   (flashinfer), SGLANG_SERVED_MODEL_NAME (qwen3.8-27b-int8-w8a16),
#   SGLANG_MODEL_ROOT (OBLIGATOIRE — dossier parent du cache HF local, celui
#     qui contient models--lued--... et models--z-lab--...), MODEL_SNAPSHOT
#     (7c12373712d1363e2b76655cb3332c9c124627d7), MODEL_REPO_DIR
#     (models--lued--Qwen3.8-27B-INT8-W8A16-MTP),
#   SGLANG_MAMBA_CACHE_SIZE (8), SGLANG_DOCKER_IMAGE (lmsysorg/sglang:latest)
#
# ⚠️ TOUTES les variables sont préfixées SGLANG_ : le shell exporte un jeu de
# variables homonymes (MODEL_ROOT, PORT, TP, ...) qui, sinon, écraserait le
# .env à chaque docker compose (le shell prime sur .env). Le préfixe rend le
# projet immunisé — voir le commentaire sur SGLANG_MAMBA_CACHE_SIZE.
#
# Décodage spéculatif (voir README → « DFLASH2 (optionnel) ») :
#   SPEC_ALGORITHM (EAGLE)      EAGLE = MTP in-checkpoint (défaut) ;
#                               DFLASH = modèle draft externe DFlash2
#   DRAFT_REPO_DIR (models--z-lab--Qwen3.8-27B-DFlash2), DRAFT_SNAPSHOT
#     (50307d4c4cde6860d4eee73e2547cd786fe8e8a4)   draft local (monté, aucun
#     téléchargement) — utilisés seulement si SPEC_ALGORITHM=DFLASH
#   SPEC_NUM_STEPS (3), SPEC_EAGLE_TOPK (1)         uniquement EAGLE
#   SPEC_NUM_DRAFT_TOKENS (4 pour EAGLE, 8 pour DFLASH — block size DFlash2)
#
# Tout est chargé depuis le cache HF local monté en lecture seule : le modèle
# cible ET le draft DFlash2. Aucun téléchargement au boot.
# ============================================================================

name: sglang-qwen3

services:
  sglang:
    # Tag d'image surchargeable (mise à jour SGLang = changer ici ou dans .env).
    # DFLASH2 ⇒ SGLANG_DOCKER_IMAGE=lmsysorg/sglang:dev (build de main).
    image: "${SGLANG_DOCKER_IMAGE:-lmsysorg/sglang:latest}"
    container_name: sglang-qwen3
    restart: unless-stopped
    # tini comme PID 1 : gestion propre des signaux / récolte des zombies
    init: true

    # Recommandé par la doc SGLang pour le TP multi-GPU (KV cache / NCCL).
    ipc: host
    shm_size: "32g"

    # Mêmes variables d'environnement que start.sh (2× 3090 en PCIe, pas de
    # NVLink : stabilise NCCL comme le setup vLLM).
    environment:
      NCCL_P2P_DISABLE: "1"
      NCCL_IB_DISABLE: "1"
      NCCL_CUMEM_ENABLE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TOKENIZERS_PARALLELISM: "false"

    # Cache Hugging Face local monté en lecture seule : le DOSSIER PARENT qui
    # contient models--lued--... (modèle cible) ET models--z-lab--... (draft
    # DFLASH2). On monte le parent et non le snapshot : les fichiers des
    # snapshots sont des liens symboliques relatifs vers ../../blobs/... qui
    # doivent rester résolus dans le conteneur. Aucun téléchargement au boot.
    volumes:
      - "${SGLANG_MODEL_ROOT:?SGLANG_MODEL_ROOT doit être défini — copier .env.example vers .env et pointer vers le dossier parent du cache HF (celui qui contient models--lued--... et models--z-lab--...)}:/models:ro"

    ports:
      - "${SGLANG_PORT:-1234}:${SGLANG_PORT:-1234}"

    # GPU exposés au conteneur (GPU_COUNT doit valoir TP).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "${SGLANG_GPU_COUNT:-2}"
              capabilities: [gpu]

    # ====== Équivalent de start.sh (python -m sglang.launch_server) ======
    # Enveloppe bash pour construire les arguments du décodage spéculatif
    # selon SPEC_ALGORITHM (EAGLE = MTP in-checkpoint, DFLASH = draft externe).
    # NB : ${VAR} est interpolé par docker compose (mêmes valeurs que .env) ;
    # $${VAR} échappe l'interpolation → expansion bash locale.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        EXTRA_SPEC_ARGS=""
        if [ "${SPEC_ALGORITHM:-EAGLE}" = "DFLASH" ]; then
          # Draft local (monté depuis SGLANG_MODEL_ROOT) : snapshot z-lab DFlash2.
          EXTRA_SPEC_ARGS="--speculative-draft-model-path /models/${DRAFT_REPO_DIR:-models--z-lab--Qwen3.8-27B-DFlash2}/snapshots/${DRAFT_SNAPSHOT:-50307d4c4cde6860d4eee73e2547cd786fe8e8a4} --speculative-num-draft-tokens ${SPEC_NUM_DRAFT_TOKENS:-8}"
        else
          EXTRA_SPEC_ARGS="--speculative-num-steps ${SPEC_NUM_STEPS:-3} --speculative-eagle-topk ${SPEC_EAGLE_TOPK:-1} --speculative-num-draft-tokens ${SPEC_NUM_DRAFT_TOKENS:-4}"
        fi
        exec python3 -m sglang.launch_server \
          --model-path "/models/${MODEL_REPO_DIR:-models--lued--Qwen3.8-27B-INT8-W8A16-MTP}/snapshots/${MODEL_SNAPSHOT:-7c12373712d1363e2b76655cb3332c9c124627d7}" \
          --served-model-name "${SGLANG_SERVED_MODEL_NAME:-qwen3.8-27b-int8-w8a16}" \
          --tp-size "${SGLANG_TP:-2}" \
          --trust-remote-code \
          --dtype bfloat16 \
          --disable-custom-all-reduce \
          --mm-feature-transport cpu \
          --mem-fraction-static "${SGLANG_MEM_FRACTION:-0.95}" \
          --attention-backend "${SGLANG_ATTN_BACKEND:-flashinfer}" \
          --chunked-prefill-size 8192 \
          --disable-prefill-cuda-graph \
          --kv-cache-dtype fp8_e4m3 \
          --mamba-ssm-dtype bfloat16 \
          --mamba-full-memory-ratio 4.21 \
          --mamba-radix-cache-strategy extra_buffer_lazy \
          --max-mamba-cache-size "${SGLANG_MAMBA_CACHE_SIZE:-8}" \
          --max-running-requests "${SGLANG_MAX_CONCURRENT_REQUESTS:-2}" \
          --context-length "${SGLANG_CONTEXT_LENGTH:-220000}" \
          --speculative-algorithm "${SPEC_ALGORITHM:-EAGLE}" \
          $${EXTRA_SPEC_ARGS} \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_coder \
          --sampling-defaults model \
          --host "${SGLANG_HOST:-0.0.0.0}" \
          --port "${SGLANG_PORT:-1234}"

    # 1er boot = compilation JIT + capture CUDA graphs (~5 min à froid).
    # NB : pendant un prefill très long (gros contexte, requête unique), la
    # boucle HTTP ne répond pas toujours dans les délais → intervalle/timout
    # généreux + retries. Un unhealthy temporaire reste sans conséquence
    # (restart: unless-stopped ne réagit qu'à la sortie du process).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1234/health', timeout=30)"]
      interval: 60s
      timeout: 35s
      retries: 5
      start_period: 300s

    stop_grace_period: 60s

    logging:
      options:
        max-size: "50m"
        max-file: "3"
