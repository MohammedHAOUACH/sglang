# ============================================================================
# SGLang — Qwen3.8-27B-INT8-W8A16-MTP (serveur d'inférence, Docker)
#
# Équivalent Docker de start.sh : mêmes arguments launch_server, mêmes
# réglages réseau/NCCL (2× RTX 3090 sans NVLink), port 1234.
#
# POUR UNE AUTRE MACHINE :
#   1. cp .env.example .env
#   2. Éditer .env : MODEL_ROOT (chemin du cache Hugging Face local du modèle)
#   3. docker compose up -d
#
# Image officielle SGLang (Docker Hub) : lmsysorg/sglang
#   - "latest"          = dernier stable, CUDA 13, outils de build inclus
#     (nécessaire : compilation JIT des kernels GPTQ-Marlin au 1er boot)
#   - "latest-runtime"  = plus léger (~40 %) mais SANS outils de build
#   - "latest-cu129"    = variante CUDA 12.9 (driver hôte < 580)
#
# Variables (défauts entre parenthèses) — voir .env.example :
#   PORT (1234), HOST (0.0.0.0), TP (2), GPU_COUNT (2), CONTEXT_LENGTH
#   (262144), MEM_FRACTION (0.95), MAX_CONCURRENT_REQUESTS (1),
#   ATTN_BACKEND (flashinfer), SERVED_MODEL_NAME (qwen3.8-27b-int8-w8a16),
#   MODEL_ROOT (OBLIGATOIRE), MODEL_SNAPSHOT (7c12373712d1363e2b76655cb3332c9c124627d7),
#   MAMBA_CACHE_SIZE (4), SGLANG_IMAGE (lmsysorg/sglang:latest)
# ============================================================================

name: sglang-qwen3

services:
  sglang:
    # Tag d'image surchargeable (mise à jour SGLang = changer ici ou dans .env)
    image: "${SGLANG_IMAGE:-lmsysorg/sglang:latest}"
    container_name: sglang-qwen3
    restart: unless-stopped
    # tini comme PID 1 : gestion propre des signaux / récolte des zombies
    init: true

    # Recommandé par la doc SGLang pour le TP multi-GPU (KV cache / NCCL).
    ipc: host
    shm_size: "32g"

    # Mêmes variables d'environnement que start.sh (2× 3090 en PCIe, pas de
    # NVLink : stabilise NCCL comme le setup vLLM).
    environment:
      NCCL_P2P_DISABLE: "1"
      NCCL_IB_DISABLE: "1"
      NCCL_CUMEM_ENABLE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TOKENIZERS_PARALLELISM: "false"

    # Modèle local monté en lecture seule. On monte le DOSSIER PARENT
    # (models--lued--...) et non le snapshot : les fichiers du snapshot sont
    # des liens symboliques relatifs vers ../../blobs/... qui doivent rester
    # résolus dans le conteneur.
    volumes:
      - "${MODEL_ROOT:?MODEL_ROOT doit être défini — copier .env.example vers .env et adapter le chemin du modèle}:/models:ro"

    ports:
      - "${PORT:-1234}:${PORT:-1234}"

    # GPU exposés au conteneur (GPU_COUNT doit valoir TP).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "${GPU_COUNT:-2}"
              capabilities: [gpu]

    # ====== Équivalent de start.sh (python -m sglang.launch_server) ======
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - "/models/snapshots/${MODEL_SNAPSHOT:-7c12373712d1363e2b76655cb3332c9c124627d7}"
      - --served-model-name
      - "${SERVED_MODEL_NAME:-qwen3.8-27b-int8-w8a16}"
      - --tp-size
      - "${TP:-2}"
      - --trust-remote-code
      - --dtype
      - bfloat16
      - --disable-custom-all-reduce
      - --mm-feature-transport
      - cpu
      - --mem-fraction-static
      - "${MEM_FRACTION:-0.95}"
      - --attention-backend
      - "${ATTN_BACKEND:-flashinfer}"
      - --chunked-prefill-size
      - "8192"
      - --disable-prefill-cuda-graph
      - --kv-cache-dtype
      - fp8_e4m3
      - --mamba-ssm-dtype
      - bfloat16
      - --mamba-full-memory-ratio
      - "4.21"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      - --max-mamba-cache-size
      - "${MAMBA_CACHE_SIZE:-4}"
      - --max-running-requests
      - "${MAX_CONCURRENT_REQUESTS:-1}"
      - --context-length
      - "${CONTEXT_LENGTH:-262144}"
      - --speculative-algorithm
      - EAGLE
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --sampling-defaults
      - model
      - --host
      - "${HOST:-0.0.0.0}"
      - --port
      - "${PORT:-1234}"

    # 1er boot = compilation JIT + capture CUDA graphs (~5 min à froid).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1234/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

    stop_grace_period: 60s

    logging:
      options:
        max-size: "50m"
        max-file: "3"
